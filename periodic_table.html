<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interactive 3D Periodic Table</title>
<style>
:root{--bg:#04060a;--tx:#e8f1ff;--mu:#8a9bb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(ellipse at 50% 0,#0d1830 0,#04060a 60%) fixed;color:var(--tx);font-family:"Segoe UI",system-ui,sans-serif;min-height:100%}
header{padding:18px 14px 6px;text-align:center}
h1{margin:0;font-weight:200;letter-spacing:.35em;font-size:clamp(16px,3.4vw,30px);text-transform:uppercase;background:linear-gradient(90deg,#7df,#fff,#c8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:12px;margin-top:4px}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:8px 12px}
input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:10px 16px;color:var(--tx);width:min(340px,92vw);font-size:16px;outline:none;backdrop-filter:blur(10px)}
input:focus{border-color:#7df;box-shadow:0 0 14px #7df6}
button{font:inherit;color:var(--tx);cursor:pointer}
.chip{background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:99px;padding:5px 11px;font-size:12px;display:flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip.on{background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 50%,transparent)}
.chip.all{--c:#fff}
#wrap{overflow-x:auto;padding:14px 10px 40px;perspective:1400px;-webkit-overflow-scrolling:touch}
#table{display:grid;grid-template-columns:repeat(18,minmax(52px,1fr));grid-template-rows:repeat(7,auto) 14px repeat(2,auto);gap:5px;min-width:960px;max-width:1500px;margin:0 auto;transform-style:preserve-3d;transition:transform .3s ease-out}
.t{--c:#888;position:relative;aspect-ratio:1/1.12;border-radius:9px;padding:4px 5px;cursor:pointer;overflow:hidden;
background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.03) 45%,color-mix(in srgb,var(--c) 22%,transparent));
border:1px solid rgba(255,255,255,.22);border-top-color:rgba(255,255,255,.5);border-left-color:rgba(255,255,255,.38);
box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -8px 14px color-mix(in srgb,var(--c) 25%,transparent),0 8px 14px rgba(0,0,0,.6),0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent);
backdrop-filter:blur(6px);transition:transform .2s,box-shadow .2s,opacity .3s,filter .3s;display:flex;flex-direction:column;text-align:center;color:var(--tx)}
.t::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35) 0,transparent 30%);pointer-events:none;opacity:.6}
.t:hover,.t:focus-visible{transform:translateZ(40px) scale(1.18);z-index:5;outline:none;box-shadow:inset 0 1px 0 #fff8,0 18px 30px #000,0 0 22px var(--c)}
.t .n{font-size:9px;text-align:left;color:var(--mu)}
.t .s{font-size:clamp(15px,1.7vw,22px);font-weight:600;line-height:1;text-shadow:0 0 10px var(--c)}
.t .nm{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .m{font-size:7.5px;color:var(--mu)}
.gem{width:46%;aspect-ratio:1;margin:1px auto;flex:none}
.t.dim{opacity:.1;filter:grayscale(1);pointer-events:none}
.t.hit{animation:pulse 1s 3;z-index:6}
@keyframes pulse{50%{transform:translateZ(50px) scale(1.3);box-shadow:0 0 36px #fff}}
.lab{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mu)}
/* gem material styles */
.g-solid{border-radius:22%;background:conic-gradient(from 30deg,var(--l),var(--c),var(--d),var(--c),var(--l),var(--d),var(--c),var(--l));box-shadow:inset 0 0 6px #fff8,0 3px 6px #000a}
.g-liquid{border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,var(--l) 12%,var(--c) 45%,var(--d) 100%);box-shadow:0 3px 6px #000a}
.g-gas{border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent) 0,transparent 70%);filter:blur(1.5px)}
#tip{position:fixed;z-index:50;pointer-events:none;background:rgba(10,16,30,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 11px;font-size:12px;opacity:0;transition:opacity .15s;max-width:210px}
/* viewer */
#v{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 30% 40%,color-mix(in srgb,var(--c) 35%,#04060a) 0,#020306 80%);background-color:#02030a;display:none;opacity:0;transition:opacity .45s;flex-direction:row}
#v.show{opacity:1}
#stage{flex:1.2;position:relative;perspective:900px;overflow:hidden;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;min-height:0}
#stage:active{cursor:grabbing}
#pan{transform-style:preserve-3d;position:relative;width:0;height:0}
#obj{transform-style:preserve-3d;position:absolute;left:0;top:0}
.f{position:absolute;left:calc(var(--s)/-2);top:calc(var(--s)/-2);width:var(--s);height:var(--s);backface-visibility:hidden;border:1px solid rgba(255,255,255,.3);
background:linear-gradient(var(--a,135deg),var(--l) 0,var(--c) 35%,var(--d) 65%,var(--c) 85%,var(--l) 100%);box-shadow:inset 0 0 40px #0006}
.f::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%)}
.sph{position:absolute;border-radius:50%;left:calc(var(--s)/-2);top:calc(var(--s)/-2);width:var(--s);height:var(--s);background:radial-gradient(circle at 32% 28%,#fff 0,var(--l) 10%,var(--c) 45%,var(--d) 100%);box-shadow:inset -20px -20px 50px #0008,0 0 60px color-mix(in srgb,var(--c) 40%,transparent)}
.pt{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--l),transparent 70%)}
#shadow{position:absolute;bottom:12%;left:50%;width:240px;height:30px;margin-left:-120px;background:radial-gradient(ellipse,#0009,transparent 70%)}
#ctl{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.b{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:9px 15px;backdrop-filter:blur(10px);font-size:13px}
.b:hover,.b:focus-visible{background:rgba(255,255,255,.2);outline:none}
#x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:3;width:44px;height:44px;padding:0;font-size:20px}
#note{position:absolute;top:12px;left:14px;font-size:11px;color:var(--mu);max-width:60%}
#info{flex:1;overflow-y:auto;padding:22px 20px 40px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border-left:1px solid rgba(255,255,255,.2);backdrop-filter:blur(18px);min-width:0}
#info h2{margin:0;font-size:clamp(28px,4vw,46px);font-weight:300}
#info h2 b{color:var(--c);text-shadow:0 0 18px var(--c);margin-right:10px}
.cat{display:inline-block;margin:6px 0 10px;padding:3px 12px;border-radius:99px;border:1px solid var(--c);color:var(--c);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin:12px 0}
.k{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px 10px}
.k small{display:block;color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.k span{font-size:14px;word-break:break-word}
.k em{font-style:normal;color:#789;font-size:11px}
#info h3{margin:16px 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
#info p,#info li{font-size:14px;line-height:1.55;color:#cfdcf2;margin:4px 0}
#info ul{padding-left:18px;margin:4px 0}
.nav{display:flex;gap:8px;margin-top:18px}
@media(max-width:800px){
#v{flex-direction:column}#stage{flex:none;height:44vh}#info{flex:1;border-left:0;border-top:1px solid rgba(255,255,255,.2);padding:16px 14px 40px}
#table{min-width:0;grid-template-columns:repeat(18,40px);gap:3px}.t{padding:2px;border-radius:6px}.t .nm,.t .m,.gem{display:none}.t .s{font-size:14px;margin-top:2px}.t .n{font-size:7px}
#ctl .b{padding:7px 11px;font-size:12px}#note{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- revision 2 overrides ---- */
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
#shadow{z-index:0}#ctl,#note{z-index:2}
.t:hover,.t:focus-visible{transform:none;border-color:var(--c);outline:none;background:linear-gradient(145deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 45%,color-mix(in srgb,var(--c) 38%,transparent));box-shadow:inset 0 1px 0 #fff9,inset 0 -8px 14px color-mix(in srgb,var(--c) 35%,transparent),0 0 16px var(--c)}
@keyframes pulse{50%{box-shadow:0 0 26px 4px #fff;border-color:#fff}}
#tip{width:max-content;font-size:13px;line-height:1.5;padding:9px 13px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(10,16,30,.88));box-shadow:0 10px 30px #000a}
.t.sm .m{display:none}.t.xs .gem{display:none}
#info p,#info li{font-size:16px}.k span{font-size:16px}.k small{font-size:12px}.k em{font-size:13px}#info h3{font-size:14px}.cat{font-size:14px}.b{font-size:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}#note{font-size:12px}
@media(min-width:801px){html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column;height:100dvh}
header{padding:8px 14px 0}h1{font-size:clamp(14px,2.2vw,24px)}.sub{display:none}.bar{padding:4px 12px}.chip{padding:3px 9px;font-size:12px}input{padding:7px 14px}
#wrap{flex:1;min-height:0;overflow:hidden;padding:4px 14px 10px;perspective:none;display:flex;align-items:center;justify-content:center}
#table{margin:0;min-width:0;max-width:none;transform:none}
.t .n{font-size:max(7px,calc(var(--w)*.17))}.t .s{font-size:max(11px,calc(var(--w)*.34))}.t .nm{font-size:max(7px,calc(var(--w)*.15))}.t .m{font-size:max(7px,calc(var(--w)*.14))}
.gem{flex:1 1 0;min-height:0;width:auto;aspect-ratio:1;max-width:60%;align-self:center}}
#wrap{perspective:none}#table{transform:none!important}
.t.xs .nm{display:none}.t.sm .m{display:block!important}.t .m{line-height:1.15;white-space:nowrap}@media(max-width:800px){.t .m{display:block!important;font-size:6.5px;letter-spacing:-.2px}}
@media(min-width:801px){.t .gem{position:absolute;top:4px;right:4px;width:27%;max-width:none;flex:none;min-height:0;margin:0}}

/* ---- language switch + RTL ---- */
#lang{position:fixed;top:10px;inset-inline-end:14px;z-index:30;display:flex;padding:3px;gap:2px;border-radius:99px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.55);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(0,0,0,.55)}
#lang button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-size:14px;line-height:1.3;color:var(--mu);transition:.25s}
#lang button[aria-pressed=true]{color:#fff;background:linear-gradient(145deg,rgba(125,221,255,.55),rgba(170,120,255,.42));box-shadow:0 0 14px #7df8}
#lang button:focus-visible{outline:2px solid #7df}
@media(max-width:800px){header{padding-top:52px}#lang{top:8px}}

html[dir=rtl] h1,html[dir=rtl] .k small,html[dir=rtl] #info h3{letter-spacing:0}
html[dir=rtl] #table{direction:ltr}
html[dir=rtl] #info p,html[dir=rtl] #info li{line-height:1.95}
html[dir=rtl] #info ul{padding-left:0;padding-right:20px}
html[dir=rtl] #info h2 b{margin-right:0;margin-left:10px}
html[dir=rtl] #x{right:auto;left:12px}html[dir=rtl] #note{left:auto;right:14px}
@media(min-width:801px){html[dir=rtl] #v{flex-direction:row-reverse}html[lang=fa] .t .nm{font-size:max(8.5px,calc(var(--w)*.16))}}
